name = "my-vercel-vault"
main = "worker/index.js"
compatibility_date = "2025-06-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*"]

[vars]
REGISTRATION_OPEN = "true"

[[d1_databases]]
binding = "DB"
database_name = "my-vercel-vault-db"
database_id = "00000000-0000-0000-0000-000000000000" # Replace with the D1 database ID before deploying.
migrations_dir = "worker/migrations"

[triggers]
crons = ["17 * * * *"]
